x-app-environment: &app-environment
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS in .env}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [app]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - redis_data:/data
    networks: [app]

  migrations:
    build: .
    environment:
      <<: *app-environment
      DJANGO_SETTINGS_MODULE: config.settings.container
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CERTIFICATE_ENCRYPTION_KEY_FILE: ${CERTIFICATE_ENCRYPTION_KEY_FILE:-/dados/certificados/.secrets/certificate-vault.key}
      CERTIFICATE_UPLOAD_PRIVATE_KEY_FILE: ${CERTIFICATE_UPLOAD_PRIVATE_KEY_FILE:-/dados/certificados/.secrets/certificate-upload-private.key}
      CERTIFICATE_UPLOAD_PUBLIC_KEY_FILE: /dados/certificate-public/certificate-upload-public.key
    command: >
      sh -c "python manage.py generate_certificate_key --if-missing &&
      python manage.py generate_certificate_upload_keypair --if-missing &&
      python manage.py migrate --noinput"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${CERTIFICATES_HOST_DIR:?set CERTIFICATES_HOST_DIR in .env}
        target: /dados/certificados
      - type: bind
        source: ${CERTIFICATE_PUBLIC_HOST_DIR:?set CERTIFICATE_PUBLIC_HOST_DIR in .env}
        target: /dados/certificate-public
    networks: [app]

  web:
    build: .
    environment:
      <<: *app-environment
      DJANGO_SETTINGS_MODULE: config.settings.container
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CERTIFICATE_UPLOAD_PUBLIC_KEY_FILE: /dados/certificate-public/certificate-upload-public.key
    command: >
      sh -c "python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile - --error-logfile -"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${NOTES_HOST_DIR:?set NOTES_HOST_DIR in .env}
        target: /dados/notas
        read_only: true
      - type: bind
        source: ${CERTIFICATE_PUBLIC_HOST_DIR:?set CERTIFICATE_PUBLIC_HOST_DIR in .env}
        target: /dados/certificate-public
        read_only: true
    networks: [app]

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8080"
    volumes:
      - type: bind
        source: ./deploy/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    networks: [app]

  worker:
    build: .
    environment:
      <<: *app-environment
      DJANGO_SETTINGS_MODULE: config.settings.container
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      SEFAZ_ENABLED_ENVIRONMENTS: ${SEFAZ_ENABLED_ENVIRONMENTS:-}
      CERTIFICATE_ENCRYPTION_KEY_FILE: ${CERTIFICATE_ENCRYPTION_KEY_FILE:-/dados/certificados/.secrets/certificate-vault.key}
      CERTIFICATE_UPLOAD_PRIVATE_KEY_FILE: ${CERTIFICATE_UPLOAD_PRIVATE_KEY_FILE:-/dados/certificados/.secrets/certificate-upload-private.key}
      CERTIFICATE_UPLOAD_PUBLIC_KEY_FILE: /dados/certificate-public/certificate-upload-public.key
    command: >
      sh -c "python manage.py generate_certificate_key --if-missing &&
      python manage.py generate_certificate_upload_keypair --if-missing &&
      celery -A config worker --loglevel=INFO"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${NOTES_HOST_DIR:?set NOTES_HOST_DIR in .env}
        target: /dados/notas
      - type: bind
        source: ${CERTIFICATES_HOST_DIR:?set CERTIFICATES_HOST_DIR in .env}
        target: /dados/certificados
      - type: bind
        source: ${CERTIFICATE_PUBLIC_HOST_DIR:?set CERTIFICATE_PUBLIC_HOST_DIR in .env}
        target: /dados/certificate-public
    networks: [app]

  scheduler:
    build: .
    environment:
      <<: *app-environment
      DJANGO_SETTINGS_MODULE: config.settings.container
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    command: celery -A config beat --loglevel=INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks: [app]

volumes:
  postgres_data:
  redis_data:

networks:
  app:
