x-app-environment: &app-environment
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS in .env}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [app]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - redis_data:/data
    networks: [app]

  web:
    build: .
    environment:
      <<: *app-environment
      DJANGO_SETTINGS_MODULE: config.settings.container
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile - --error-logfile -"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${NOTES_HOST_DIR:?set NOTES_HOST_DIR in .env}
        target: /dados/notas
        read_only: true
    networks: [app]

  worker:
    build: .
    environment:
      <<: *app-environment
      DJANGO_SETTINGS_MODULE: config.settings.container
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CERTIFICATE_ENCRYPTION_KEY_FILE: ${CERTIFICATE_ENCRYPTION_KEY_FILE:-/dados/certificados/.secrets/certificate-vault.key}
    command: celery -A config worker --loglevel=INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${NOTES_HOST_DIR:?set NOTES_HOST_DIR in .env}
        target: /dados/notas
      - type: bind
        source: ${CERTIFICATES_HOST_DIR:?set CERTIFICATES_HOST_DIR in .env}
        target: /dados/certificados
    networks: [app]

  scheduler:
    build: .
    environment:
      <<: *app-environment
      DJANGO_SETTINGS_MODULE: config.settings.container
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    command: celery -A config beat --loglevel=INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [app]

volumes:
  postgres_data:
  redis_data:

networks:
  app:
